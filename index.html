<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>我的品牌網站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: "微軟正黑體", sans-serif; background: #f8f8f8; margin: 0; }
.banner-area {
  width: 100%;
  background: #fff;
  box-shadow: 0 4px 18px #0001;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  margin: 0;
  overflow: hidden; /* 超出的部分隱藏 */
}

.banner-area img {
  width: 100%;
  max-width: 1200px;
  height: auto;
  display: block;
  margin: 0 auto;
  border-radius: 0 0 24px 24px;
  transition: all 0.2s;
}

/* 手機版，固定高度並裁切 */
@media (max-width: 600px) {
  .banner-area {
    height: 90px;         /* 你想要的手機橫幅高度 */
    min-height: 60px;
  }
  .banner-area img {
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;    /* 裁切中間主視覺 */
  }
}


    nav {
      text-align: center;
      margin-top: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    nav button {
      background: none;
      border: none;
      font-size: 1.1rem;
      padding: 18px 32px;
      margin: 0 8px;
      color: #333;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: bold;
      letter-spacing: 2px;
      transition: border-bottom .2s;
    }
    nav button.active {
      border-bottom: 3px solid #be873b;
      color: #be873b;
    }
    .page { display: none; max-width: 900px; background: #fff; margin: 40px auto 0; padding: 36px 32px; border-radius: 16px; box-shadow: 0 2px 14px #0001; }
    .page.active { display: block; }

@media (max-width: 700px) {
  .banner-area img {
    border-radius: 0 0 8vw 8vw;
  }
  nav {
    display: block;
    text-align: center;
    padding-bottom: 1px;
  }
  nav button {
    font-size: 1em;
    padding: 12px 8px;
    margin: 4px 2px;
    min-width: 0;
    white-space: normal;
    flex: none;
  }
  .page { padding: 8vw 4vw; margin-top: 6vw; }
}
    

html {
  scroll-behavior: smooth; /* 瀏覽器自動平滑滾動 */
}
.subnav {
  text-align: center;
  margin-bottom: 20px;
}
.subnav .subtab {
  background: #f8f8f8;
  border: none;
  font-size: 1em;
  padding: 10px 20px;
  margin: 0 4px;
  color: #333;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-weight: bold;
  border-radius: 20px 20px 0 0;
  transition: border-bottom .2s, color .2s, background .2s;
  display: inline-block;
  text-decoration: none;
}
.subnav .subtab:hover,
.subnav .subtab:focus {
  background: #be873b;
  color: #fff;
  border-bottom: 2px solid #be873b;
}
.subsection {
  margin-bottom: 36px;
  padding: 16px 0;
  border-bottom: 1px dashed #ccc;
}

#backToTop {
  position: fixed;
  right: 20px;
  bottom: 36px;
  z-index: 99;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #be873b;
  color: #fff;
  font-size: 1.8em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 8px #0002;
  opacity: 0.7;
  transition: opacity 0.2s;
  display: none; /* 一開始不顯示 */
}
#backToTop:hover {
  opacity: 1;
  background: #c69445;
}
@media (max-width: 600px) {
  #backToTop { width: 38px; height: 38px; font-size: 1.2em; bottom: 18px; right: 8px; }
}

@media (max-width: 600px) {
  .subnav {
    display: block;           /* 不用 flex */
    overflow-x: visible;      /* 不要橫向滑動 */
    white-space: normal;      /* 可以自動換行 */
    margin-bottom: 10px;
    text-align: center;
  }
  .subnav .subtab {
    font-size: 0.95em;
    padding: 7px 12px;
    margin: 4px 2px;
    min-width: 0;
    display: inline-block;    /* 可自動排兩行 */
    box-sizing: border-box;
  }
}

  </style>
</head>
<body>
  <!-- 橫幅 Banner 圖片，會永遠顯示在最上方 -->
  <div class="banner-area">
    <img src="001.png" alt="網站橫幅">
  </div>

  <nav>
  <button class="tab active" data-page="home">首頁</button>
  <button class="tab" data-page="products">產品介紹</button>
  <button class="tab" data-page="faq">FQA</button>
  <button class="tab" data-page="info">購買須知</button>
  <button class="tab" data-page="contact">聯絡我們</button>
</nav>

<div id="home" class="page active">
  <h1>歡迎來到我的品牌！</h1>
  <p>這裡是首頁內容。</p>
</div>
<div id="products" class="page">
  <h1>產品介紹</h1>
  <div class="subnav">
    <a href="#mosaic" class="subtab">積木畫</a>
    <a href="#keychain" class="subtab">木鑰匙圈</a>
    <a href="#lamp" class="subtab">雷雕夜燈</a>
    <a href="#bracelet" class="subtab">不鏽鋼手鍊</a>
    <a href="#other" class="subtab">其他商品</a>
  </div>
  <div id="mosaic" class="subsection">
    <h2>積木畫</h2>
    <p>這裡放積木畫介紹</p>
  </div>
  <div id="keychain" class="subsection">
    <h2>木鑰匙圈</h2>
    <p>這裡放木鑰匙圈介紹</p>
  </div>
  <div id="lamp" class="subsection">
    <h2>雷雕夜燈</h2>
    <p>這裡放夜燈介紹</p>
  </div>
  <div id="bracelet" class="subsection">
    <h2>不鏽鋼手鍊</h2>
    <p>這裡放手鍊介紹</p>
  </div>
  <div id="other" class="subsection">
    <h2>其他商品</h2>
    <p>這裡放其他商品介紹</p>
  </div>
</div>
<div id="faq" class="page">
    <h1>常見問答（FAQ）</h1>
    <p>這裡整理你想給客人的常見問題解答。</p>
  </div>
  <div id="info" class="page">
    <h1>購買須知</h1>
    <p>這裡放下單流程、付款/出貨/運費等說明。</p>
  </div>
  <div id="contact" class="page">
    <h1>聯絡我們</h1>
    <p>這裡可以放Email、LINE、聯絡表單等方式。</p>
  </div>

  <script>
    // 分頁切換功能
    const tabs = document.querySelectorAll('.tab');
    const pages = document.querySelectorAll('.page');
    tabs.forEach(tab => {
      tab.onclick = function() {
        tabs.forEach(t => t.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.page).classList.add('active');
      }
    });
  </script>

<button id="backToTop" title="回到最上面">↑</button>
<script>
  // 顯示/隱藏回到最上頁按鈕
  window.onscroll = function() {
    document.getElementById("backToTop").style.display =
      (document.documentElement.scrollTop || document.body.scrollTop) > 120 ? "block" : "none";
  };
  // 點擊回到頂部
  document.getElementById("backToTop").onclick = function() {
    window.scrollTo({top:0, behavior:'smooth'});
  }
</script>


</body>
</html>
