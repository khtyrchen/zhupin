<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>竹拼</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* 全站字體與背景 */
    body {
      font-family: "微軟正黑體", sans-serif;
      background: #f8f8f8;
      margin: 0;
    }

    /* 頁首橫幅區域 */
    .banner-area {
      width: 100%;
      background: #fff;
      box-shadow: 0 4px 18px #0001;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .banner-area img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 0 0 24px 24px;
      transition: all 0.2s;
    }
    /* 手機版橫幅自動裁切縮放 */
    @media (max-width: 600px) {
      .banner-area {
        height: 90px;
        min-height: 60px;
      }
      .banner-area img {
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
        border-radius: 0;
      }
    }

    /* 導覽列按鈕（分頁） */
    nav {
      text-align: center;
      margin-top: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    nav button {
      background: none;
      border: none;
      font-size: 1.1rem;
      padding: 18px 32px;
      margin: 0 8px;
      color: #333;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: bold;
      letter-spacing: 2px;
      transition: border-bottom .2s;
    }
    nav button.active {
      border-bottom: 3px solid #be873b;
      color: #be873b;
    }
    /* 響應式：小螢幕時自動變兩行 */
    @media (max-width: 700px) {
      .banner-area img { border-radius: 0 0 8vw 8vw; }
      nav {
        display: block;
        text-align: center;
        padding-bottom: 1px;
      }
      nav button {
        font-size: 1em;
        padding: 12px 8px;
        margin: 4px 2px;
        min-width: 0;
        white-space: normal;
        flex: none;
      }
      .page { padding: 8vw 4vw; margin-top: 6vw; }
    }

    /* 分頁內容區塊 */
    .page {
      display: none;
      max-width: 900px;
      background: #fff;
      margin: 40px auto 0;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 2px 14px #0001;
    }
    .page.active { display: block; }

    /* 首頁、商品照圖片卡片格式 */
    .card-img {
      display: block;
      max-width: 100%;
      border-radius: 24px;
      box-shadow: 0 2px 14px #0003;
      margin: 0 auto 28px auto;
    }

    /* 商品介紹頁的次導航 */
    .subnav {
      text-align: center;
      margin-bottom: 20px;
    }
    .subnav .subtab {
      background: #f8f8f8;
      border: none;
      font-size: 1em;
      padding: 10px 20px;
      margin: 0 4px;
      color: #333;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: bold;
      border-radius: 20px 20px 0 0;
      transition: border-bottom .2s, color .2s, background .2s;
      display: inline-block;
      text-decoration: none;
    }
    .subnav .subtab:hover,
    .subnav .subtab:focus {
      background: #be873b;
      color: #fff;
      border-bottom: 2px solid #be873b;
    }
    .subsection {
      margin-bottom: 36px;
      padding: 16px 0;
      border-bottom: 1px dashed #ccc;
    }
    /* 商品介紹次導航在手機上變兩排 */
    @media (max-width: 600px) {
      .subnav {
        display: block;
        overflow-x: visible;
        white-space: normal;
        margin-bottom: 10px;
        text-align: center;
      }
      .subnav .subtab {
        font-size: 0.95em;
        padding: 7px 12px;
        margin: 4px 2px;
        min-width: 0;
        display: inline-block;
        box-sizing: border-box;
      }
    }

    /* 首頁圖卡手機寬度補強 */
    @media (max-width: 600px) {
      #home img.card-img {
        width: 100vw !important;
        max-width: 100vw !important;
        margin-left: calc(-50vw + 50%);
        border-radius: 0;
      }
    }

/* 浮動按鈕區: 回到頂部、LINE 聯絡（電腦大圈圈，手機維持小圈圈） */
#backToTop, #floatLineBtn {
  position: fixed;
  right: 20px;
  z-index: 99;
  width: 60px;            /* 電腦版大圈圈 */
  height: 60px;
  border: none;
  border-radius: 50%;
  background: rgba(190, 135, 59, 0.87); /* 半透明咖啡色 */
  color: #fff;
  font-size: 2.1em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 8px #0002;
  opacity: 0.7;
  transition: opacity 0.2s, background 0.2s;
  display: none; /* 預設不顯示，由JS控制 */
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(1.5px);
}
#backToTop { bottom: 36px; }
#floatLineBtn { bottom: 108px; display: block; } /* 108px不重疊（60+12+60/4）可依實際再微調 */
#backToTop:hover, #floatLineBtn:hover {
  opacity: 1;
  background: rgba(198,148,69,0.97);
}
#floatLineBtn img {
  width: 66%; height: 66%; /* 圖案跟圈圈同步變大 */
  vertical-align: middle;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 1px 2px #0002);
  pointer-events: none;
}
/* 手機版浮動按鈕縮小 */
@media (max-width: 600px) {
  #backToTop {
    width: 38px; height: 38px; font-size: 1.2em; bottom: 18px; right: 8px;
  }
  #floatLineBtn {
    right: 8px;
    bottom: 66px;
    width: 38px; height: 38px; font-size: 1.2em;
  }
  #floatLineBtn img {
    width: 60%; height: 60%;
  }
}

    html { scroll-behavior: smooth; }
  
 /* 全部分頁（.page）內容手機圖＆影片滿版鋪滿螢幕 */
@media (max-width: 600px) {
  .page img, .page video {
    width: 100vw !important;
    max-width: 100vw !important;
    margin-left: calc(-50vw + 50%);
    border-radius: 0 !important; /* ← 這裡加 !important，確保覆蓋掉 inline 的 style */
  }
}


  </style>
</head>
<body>
  <!-- 頁首橫幅 -->
  <div class="banner-area">
    <img src="001.png" alt="網站橫幅">
  </div>

  <!-- 主分頁按鈕 -->
  <nav>
    <button class="tab active" data-page="home">首頁</button>
    <button class="tab" data-page="products">產品介紹</button>
    <button class="tab" data-page="faq">FAQ</button>
    <button class="tab" data-page="info">購買須知</button>
    <button class="tab" data-page="contact">聯絡我們</button>
  </nav>

  <!-- 分頁內容：首頁 -->
  <div id="home" class="page active">
    <img src="002.jpg" alt="首頁主視覺" class="card-img">
    <img src="003.jpg" alt="積木畫介紹" class="card-img">
    <img src="004.jpg" alt="浮雕夜燈介紹" class="card-img">
    <img src="005.jpg" alt="雷雕金屬介紹" class="card-img">
    <img src="006.jpg" alt="雷雕木製品介紹" class="card-img">
  </div>

  <!-- 分頁內容：產品介紹 -->
  <div id="products" class="page">
    <h1>產品介紹</h1>
    <!-- 產品分類次導航 -->
    <div class="subnav">
      <a href="#mosaic" class="subtab">積木畫</a>
      <a href="#code" class="subtab">積木QRCODE</a>
      <a href="#keychain" class="subtab">浮雕夜燈</a>
      <a href="#lamp" class="subtab">客製木製品</a>
      <a href="#bracelet" class="subtab">客製不鏽鋼飾品</a>
    </div>
    <!-- 各分類內容 -->
    <div id="mosaic" class="subsection">
      <h2>積木畫</h2>
      <img src="007.jpg" alt="積木畫介紹1" class="card-img">
      <img src="008.jpg" alt="積木畫介紹2" class="card-img">
      <img src="009.jpg" alt="積木畫介紹3" class="card-img">
      <!-- 積木畫介紹影片（建議尺寸已統一、圓角） -->
      <video controls style="width: 100%; border-radius: 18px; box-shadow: 0 2px 14px #0003; margin-bottom: 0;">
        <source src="010.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>
    </div>
   <div id="code" class="subsection">
      <h2>積木QRCODE</h2>
      <p>這裡放積木QRCODE介紹</p>
    </div>

    <div id="keychain" class="subsection">
      <h2>浮雕夜燈</h2>
      <p>這裡放浮雕夜燈介紹</p>
    </div>
    <div id="lamp" class="subsection">
      <h2>客製木製品</h2>
      <p>這裡放客製木製品介紹</p>
    </div>
    <div id="bracelet" class="subsection">
      <h2>客製不鏽鋼飾品</h2>
      <p>這裡放客製不鏽鋼飾品介紹</p>
    </div>
  </div>

  <!-- 分頁內容：FAQ -->
  <div id="faq" class="page">
    <h1>常見問答（FAQ）</h1>
    <p>這裡整理你想給客人的常見問題解答。</p>
  </div>

  <!-- 分頁內容：購買須知 -->
  <div id="info" class="page">
    <h1>購買須知</h1>
    <p>這裡放下單流程、付款/出貨/運費等說明。</p>
  </div>

  <!-- 分頁內容：聯絡我們 -->
  <div id="contact" class="page">
    <h1>聯絡我們</h1>
    <p>這裡可以放Email、LINE、聯絡表單等方式。</p>
  </div>

  <!-- 浮動按鈕：回頂部／LINE 聯絡 -->
  <button id="backToTop" title="回到最上面">↑</button>
  <button id="floatLineBtn" title="聯絡我們">
    <!-- 請用去背透明的line icon.png，60x60以上都可 -->
    <img src="icon.png" alt="LINE圖示">
  </button>

  <!-- 分頁/浮動按鈕功能腳本 -->
  <script>
    // 分頁切換+網址 hash 記錄
    const tabs = document.querySelectorAll('.tab');
    const pages = document.querySelectorAll('.page');
    tabs.forEach(tab => {
      tab.onclick = function() {
        tabs.forEach(t => t.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.page).classList.add('active');
        location.hash = '#' + tab.dataset.page; // 更新網址
      }
    });
    // 頁面載入時根據 hash 顯示正確分頁
    window.onload = function() {
      const hash = location.hash.replace('#','');
      if (hash) {
        const targetTab = document.querySelector(`.tab[data-page="${hash}"]`);
        const targetPage = document.getElementById(hash);
        if (targetTab && targetPage) {
          tabs.forEach(t => t.classList.remove('active'));
          pages.forEach(p => p.classList.remove('active'));
          targetTab.classList.add('active');
          targetPage.classList.add('active');
        }
      }
    }

    // 回頂鈕顯示/隱藏 + 點擊滾動頂部
    window.onscroll = function() {
      document.getElementById("backToTop").style.display =
        (document.documentElement.scrollTop || document.body.scrollTop) > 120 ? "flex" : "none";
    };
    document.getElementById("backToTop").onclick = function() {
      window.scrollTo({top:0, behavior:'smooth'});
    }

    // 浮動LINE按鈕：打開你的line網址
    document.getElementById("floatLineBtn").onclick = function() {
      window.open('https://linkgoods.com/zhupin', '_blank');
    };
  </script>
</body>
</html>
