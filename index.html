<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>竹拼</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background: #f8f8f8;
      margin: 0;
    }
    .banner-area {
      width: 100%;
      background: #fff;
      box-shadow: 0 4px 18px #0001;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .banner-area img {
      width: 100%;
      max-width: 1200px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 0 0 24px 24px;
      transition: all 0.2s;
    }
    @media (max-width: 600px) {
      .banner-area {
        height: 90px;
        min-height: 60px;
      }
      .banner-area img {
        width: 100%;
        height: 100%;
        max-width: none;
        object-fit: cover;
        border-radius: 0;
      }
    }
    nav {
      text-align: center;
      margin-top: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    nav button {
      background: none;
      border: none;
      font-size: 1.1rem;
      padding: 18px 32px;
      margin: 0 8px;
      color: #333;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: bold;
      letter-spacing: 2px;
      transition: border-bottom .2s;
    }
    nav button.active {
      border-bottom: 3px solid #be873b;
      color: #be873b;
    }
    @media (max-width: 700px) {
      .banner-area img { border-radius: 0 0 8vw 8vw; }
      nav {
        display: block;
        text-align: center;
        padding-bottom: 1px;
      }
      nav button {
        font-size: 1em;
        padding: 12px 8px;
        margin: 4px 2px;
        min-width: 0;
        white-space: normal;
        flex: none;
      }
      .page { padding: 8vw 4vw; margin-top: 6vw; }
    }
    .page {
      display: none;
      max-width: 900px;
      background: #fff;
      margin: 40px auto 0;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 2px 14px #0001;
    }
    .page.active { display: block; }
    .card-img {
      display: block;
      max-width: 100%;
      border-radius: 24px;
      box-shadow: 0 2px 14px #0003;
      margin: 0 auto 28px auto;
    }
    .subnav {
      text-align: center;
      margin-bottom: 20px;
    }
    .subbtn {
      background: #fff;
      color: #222;
      display: inline-block;
      padding: 10px 26px;
      margin: 0 10px 12px 10px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 1.08em;
      letter-spacing: 2px;
      border: none;
      outline: none;
      text-decoration: none;
      box-shadow: 0 2px 6px #0001;
      transition: background 0.2s, color 0.18s;
      border: 1.5px solid #be873b;
    }
    .subbtn:hover, .subbtn:focus {
      background: #be873b;
      color: #fff;
    }
   /* 手機版縮小次分類按鈕 */
    @media (max-width: 600px) {
     .subbtn {
     font-size: 0.95em;
     padding: 7px 14px;
     border-radius: 14px;
     margin: 0 4px 10px 4px;
     }
    }
    .backbtn {
      background: #fff;
      color: #222;
      display: inline-block;
      padding: 10px 26px;
      margin: 24px 0 0 0;
      border-radius: 18px;
      font-weight: bold;
      font-size: 1.08em;
      letter-spacing: 2px;
      border: none;
      outline: none;
      text-decoration: none;
      box-shadow: 0 2px 6px #0001;
      border: 1.5px solid #be873b;
      transition: background 0.18s, color 0.18s;
    }
    .backbtn:hover, .backbtn:focus {
      background: #be873b;
      color: #fff;
    }
    .subnav .subtab {
      background: #f8f8f8;
      border: none;
      font-size: 1em;
      padding: 10px 20px;
      margin: 0 4px;
      color: #333;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: bold;
      border-radius: 20px 20px 0 0;
      transition: border-bottom .2s, color .2s, background .2s;
      display: inline-block;
      text-decoration: none;
    }
    .subnav .subtab:hover,
    .subnav .subtab:focus {
      background: #be873b;
      color: #fff;
      border-bottom: 2px solid #be873b;
    }
    .subsection {
      margin-bottom: 36px;
      padding: 16px 0;
      border-bottom: 1px dashed #ccc;
    }
    .subsection + .subsection {
      border-top: none;
    }
    @media (max-width: 600px) {
      .subnav {
        display: block;
        overflow-x: visible;
        white-space: normal;
        margin-bottom: 10px;
        text-align: center;
      }
      .subnav .subtab {
        font-size: 0.95em;
        padding: 7px 12px;
        margin: 4px 2px;
        min-width: 0;
        display: inline-block;
        box-sizing: border-box;
      }
    }
    @media (max-width: 600px) {
      #home img.card-img {
        width: 100vw !important;
        max-width: 100vw !important;
        margin-left: calc(-50vw + 50%); border-radius: 0;
      }
    }
    #backToTop, #floatLineBtn {
      position: fixed;
      right: 20px;
      z-index: 99;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: rgba(190, 135, 59, 0.87);
      color: #fff;
      font-size: 2.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
      opacity: 0.7;
      transition: opacity 0.2s, background 0.2s;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(1.5px);
    }
    #backToTop { bottom: 36px; }
    #floatLineBtn { bottom: 108px; display: block; }
    #backToTop:hover, #floatLineBtn:hover {
      opacity: 1;
      background: rgba(198,148,69,0.97);
    }
    #floatLineBtn img {
      width: 66%; height: 66%;
      vertical-align: middle;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 1px 2px #0002);
      pointer-events: none;
    }
    @media (max-width: 600px) {
      #backToTop {
        width: 38px; height: 38px; font-size: 1.2em; bottom: 18px; right: 8px;
      }
      #floatLineBtn {
        right: 8px;
        bottom: 66px;
        width: 38px; height: 38px; font-size: 1.2em;
      }
      #floatLineBtn img {
        width: 60%; height: 60%;
      }
    }
    html { scroll-behavior: smooth; }
    @media (max-width: 600px) {
      .page img, .page video {
        width: 100vw !important;
        max-width: 100vw !important;
        margin-left: calc(-50vw + 50%);
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="banner-area">
    <img src="001.png" alt="網站橫幅">
  </div>
  <nav>
    <button class="tab active" data-page="home">首頁</button>
    <button class="tab" data-page="products">產品介紹</button>
    <button class="tab" data-page="faq">FAQ</button>
    <button class="tab" data-page="info">購買須知</button>
    <button class="tab" data-page="contact">聯絡我們</button>
  </nav>
  <div id="home" class="page active">
    <img src="002.jpg" alt="首頁主視覺" class="card-img">
    <img src="003.jpg" alt="積木畫介紹" class="card-img">
    <img src="004.jpg" alt="浮雕夜燈介紹" class="card-img">
    <img src="005.jpg" alt="雷雕金屬介紹" class="card-img">
    <img src="006.jpg" alt="雷雕木製品介紹" class="card-img">
  </div>
  <div id="products" class="page">
    <h1>產品介紹</h1>
    <div class="subnav">
      <a href="#mosaic" class="subtab">積木畫</a>
      <a href="#code" class="subtab">積木QRCODE</a>
      <a href="#keychain" class="subtab">浮雕夜燈</a>
      <a href="#lamp" class="subtab">客製木製品</a>
      <a href="#bracelet" class="subtab">客製不鏽鋼飾品</a>
    </div>
    <div id="mosaic" class="subsection">
      <h2>積木畫</h2>
      <img src="007.jpg" alt="積木畫介紹1" class="card-img">
      <img src="008.jpg" alt="積木畫介紹2" class="card-img">
      <img src="009.jpg" alt="積木畫介紹3" class="card-img">
      <video controls style="width: 100%; border-radius: 18px; box-shadow: 0 2px 14px #0003; margin-bottom: 0;">
        <source src="010.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>
    </div>
    <div id="code" class="subsection">
      <h2>積木QRCODE</h2>
      <img src="011.jpg" alt="QRCODE介紹1" class="card-img">
      <img src="012.jpg" alt="QRCODE介紹2" class="card-img">
      <video controls style="width: 100%; border-radius: 18px; box-shadow: 0 2px 14px #0003; margin-bottom: 0;">
        <source src="013.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>
    </div>
    <div id="keychain" class="subsection">
      <h2>浮雕夜燈</h2>
      <img src="014.jpg" alt="浮雕夜燈介紹1" class="card-img">
      <img src="015.jpg" alt="浮雕夜燈介紹2" class="card-img">
      <img src="016.jpg" alt="浮雕夜燈介紹3" class="card-img">
      <video controls style="width: 100%; border-radius: 18px; box-shadow: 0 2px 14px #0003; margin-bottom: 0;">
        <source src="017.mp4" type="video/mp4">
        您的瀏覽器不支援影片播放。
      </video>
    </div>
    <!-- 客製木製品區＋次分類 -->
    <div id="lamp" class="subsection">
      <h2>客製木製品</h2>
      <a href="#keychainQ" class="subbtn">Q版木鑰匙圈</a>
      <!-- <a href="#otherWood" class="subbtn">其他</a> -->
    </div>
    <div id="keychainQ" class="subsection">
      <img src="018.jpg" alt="Q版木鑰匙圈介紹1" class="card-img">
      <img src="019.jpg" alt="Q版木鑰匙圈介紹2" class="card-img">
      <img src="020.jpg" alt="Q版木鑰匙圈介紹3" class="card-img">
      <img src="021.jpg" alt="Q版木鑰匙圈介紹4" class="card-img">
      <div style="text-align:center;">
        <a href="#lamp" class="backbtn">← 返回客製木製品</a>
      </div>
    </div>
    <!--
    <div id="otherWood" class="subsection">
      <h2>其他</h2>
      <img src="024.jpg" alt="其他木製品介紹" class="card-img">
      <p>這裡放其他相關商品的介紹內容。</p>
      <div style="text-align:center;">
        <a href="#lamp" class="backbtn">← 返回客製木製品</a>
      </div>
    </div>
    -->
    <div id="bracelet" class="subsection">
      <h2>客製不鏽鋼飾品</h2>
      <p>這裡放客製不鏽鋼飾品介紹</p>
    </div>
  </div>
  <div id="faq" class="page">
    <h1>常見問答（FAQ）</h1>
    <p>這裡整理你想給客人的常見問題解答。</p>
  </div>
  <div id="info" class="page">
    <h1>購買須知</h1>
    <p>這裡放下單流程、付款/出貨/運費等說明。</p>
  </div>
  <div id="contact" class="page">
    <h1>聯絡我們</h1>
    <p>這裡可以放Email、LINE、聯絡表單等方式。</p>
  </div>
  <button id="backToTop" title="回到最上面">↑</button>
  <button id="floatLineBtn" title="聯絡我們">
    <img src="icon.png" alt="LINE圖示">
  </button>
  <script>
    // 分頁切換+網址 hash 記錄
    const tabs = document.querySelectorAll('.tab');
    const pages = document.querySelectorAll('.page');
    tabs.forEach(tab => {
      tab.onclick = function() {
        tabs.forEach(t => t.classList.remove('active'));
        pages.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.page).classList.add('active');
        location.hash = '#' + tab.dataset.page;
      }
    });

    // 修正版：進站時自動根據hash跳到對應主分頁＆子分類
    window.onload = function() {
      const hash = location.hash.replace('#','');
      if (hash) {
        // 判斷是不是主分頁
        const targetTab = document.querySelector(`.tab[data-page="${hash}"]`);
        const targetPage = document.getElementById(hash);
        if (targetTab && targetPage) {
          tabs.forEach(t => t.classList.remove('active'));
          pages.forEach(p => p.classList.remove('active'));
          targetTab.classList.add('active');
          targetPage.classList.add('active');
        } else {
          // 如果是產品介紹下的子區塊，顯示products分頁，並自動滾到區塊
          const productsSubs = [
            'mosaic','code','keychain','lamp','keychainQ','otherWood','bracelet'
          ];
          if(productsSubs.includes(hash)){
            tabs.forEach(t => t.classList.remove('active'));
            pages.forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab[data-page="products"]`).classList.add('active');
            document.getElementById("products").classList.add('active');
            // 自動平滑滾動到子區塊
            setTimeout(()=>{
              const targetSub = document.getElementById(hash);
              if(targetSub) targetSub.scrollIntoView({behavior:'smooth', block:'start'});
            }, 80);
          }
        }
      }
    }
    // 回頂鈕顯示/隱藏 + 點擊滾動頂部
    window.onscroll = function() {
      document.getElementById("backToTop").style.display =
        (document.documentElement.scrollTop || document.body.scrollTop) > 120 ? "flex" : "none";
    };
    document.getElementById("backToTop").onclick = function() {
      window.scrollTo({top:0, behavior:'smooth'});
    }
    document.getElementById("floatLineBtn").onclick = function() {
      window.open('https://linkgoods.com/zhupin', '_blank');
    };
  </script>
</body>
</html>
