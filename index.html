<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>竹拼｜客製積木畫與雷雕手作</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Noto Sans TC", "微軟正黑體", sans-serif;
      background: #f8f8f8;
      margin: 0;
      color: #222;
    }
    .banner {
      background: url('wooden_banner_2560x423.png') center center/cover no-repeat;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-top: 70px;
      padding-bottom: 40px;
    }
    nav {
      text-align: center;
      margin: 0 0 40px 0;
    }
    .tab {
      display: inline-block;
      margin: 0 16px;
      padding: 10px 24px;
      background: #f3f3f3;
      border-radius: 20px 20px 0 0;
      font-weight: bold;
      color: #35512d;
      cursor: pointer;
      border: none;
      outline: none;
      font-size: 1.1rem;
      transition: background 0.2s;
    }
    .tab.active {
      background: #be873b;
      color: #fff;
    }
    .content-section {
      display: none;
      max-width: 900px;
      background: #fff;
      margin: 0 auto;
      border-radius: 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 36px 32px;
      animation: fadeIn 0.5s;
    }
    .content-section.active {
      display: block;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="banner"></div>
  <nav>
    <button class="tab active" data-tab="home">首頁</button>
    <button class="tab" data-tab="about">品牌故事</button>
    <button class="tab" data-tab="products">商品介紹</button>
    <button class="tab" data-tab="contact">聯絡我們</button>
  </nav>
